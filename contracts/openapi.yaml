openapi: 3.1.0
info:
  title: Vibe Funnel OS Control API
  version: 1.0.0
  description: >-
    Contrato de referência do plano de controle. Endpoints mutadores exigem
    identidade de serviço, idempotência e autorização por tenant.
servers:
  - url: https://api.example.invalid
    description: Placeholder; configurar por ambiente
security:
  - bearerAuth: []
tags:
  - name: Missions
  - name: Experience
  - name: Events
  - name: Experiments
  - name: Governance
  - name: Releases
paths:
  /v1/missions:
    post:
      tags: [Missions]
      operationId: createMission
      summary: Cria uma missão validada e idempotente
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './mission.schema.json'
      responses:
        '201':
          description: Missão criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionResponse'
        '200':
          description: Resposta idempotente de missão já criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionResponse'
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/missions/{missionId}:
    get:
      tags: [Missions]
      operationId: getMission
      summary: Consulta estado e versão da missão
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: missionId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Estado da missão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionResponse'
        '404': {$ref: '#/components/responses/Problem'}
  /v1/experience/decisions:
    post:
      tags: [Experience]
      operationId: resolveExperience
      summary: Seleciona IDs de módulos de conteúdo pré-aprovados
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperienceDecisionRequest'
      responses:
        '200':
          description: Decisão ou fallback controle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceDecisionResponse'
        '400': {$ref: '#/components/responses/Problem'}
  /v1/events/batch:
    post:
      tags: [Events]
      operationId: ingestEvents
      summary: Valida, deduplica e aceita lote limitado de eventos
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: './event.schema.json'
      responses:
        '202':
          description: Eventos aceitos ou colocados em quarentena
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accepted, duplicate, quarantined]
                properties:
                  accepted: {type: integer, minimum: 0}
                  duplicate: {type: integer, minimum: 0}
                  quarantined: {type: integer, minimum: 0}
        '400': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
  /v1/experiments:
    post:
      tags: [Experiments]
      operationId: createExperiment
      summary: Registra um protocolo experimental aprovado
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './experiment.schema.json'
      responses:
        '201':
          description: Experimento em DRAFT ou APPROVED conforme decisão vinculada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateResponse'
        '422': {$ref: '#/components/responses/Problem'}
  /v1/experiments/{experimentId}/transitions:
    post:
      tags: [Experiments]
      operationId: transitionExperiment
      summary: Solicita transição validada na máquina de estados
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - name: experimentId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: Novo estado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateResponse'
        '409': {$ref: '#/components/responses/Problem'}
  /v1/governance/decisions:
    post:
      tags: [Governance]
      operationId: recordGovernanceDecision
      summary: Registra decisão governada assinada pelo ator autorizado
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './governance-decision.schema.json'
      responses:
        '201':
          description: Decisão registrada
          content:
            application/json:
              schema:
                $ref: './governance-decision.schema.json'
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/releases/{releaseId}/transitions:
    post:
      tags: [Releases]
      operationId: transitionRelease
      summary: Solicita promoção, pausa ou rollback de release
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - name: releaseId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: Estado atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateResponse'
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
        pattern: '^ten_[A-Za-z0-9_-]{8,}$'
  responses:
    Problem:
      description: Erro no formato RFC 9457 compatível
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    MissionResponse:
      type: object
      additionalProperties: false
      required: [mission_id, state, version, created_at, updated_at]
      properties:
        mission_id: {type: string}
        state:
          type: string
          enum: [DRAFT, VALIDATING, PLANNED, RUNNING, WAITING_APPROVAL, EVALUATING, APPROVED, RELEASED, OBSERVING, COMPLETED, REJECTED, CANCELLED, ROLLED_BACK]
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ExperienceDecisionRequest:
      type: object
      additionalProperties: false
      required: [funnel_id, page_id, visitor_id, consent, context]
      properties:
        funnel_id: {type: string}
        page_id: {type: string}
        visitor_id: {type: string, maxLength: 128}
        consent:
          type: object
          additionalProperties: false
          required: [analytics, personalization]
          properties:
            analytics: {type: boolean}
            personalization: {type: boolean}
        context:
          type: object
          additionalProperties: false
          properties:
            entry_source: {type: [string, 'null']}
            journey_state: {type: [string, 'null']}
            declared_stage: {type: [string, 'null']}
            device_class: {type: [string, 'null']}
    ExperienceDecisionResponse:
      type: object
      additionalProperties: false
      required: [decision_id, experience_id, modules, reason_codes, fallback, expires_at]
      properties:
        decision_id: {type: string}
        experience_id: {type: string}
        modules:
          type: object
          additionalProperties: {type: string}
        experiment:
          type: [object, 'null']
          additionalProperties: false
          properties:
            id: {type: string}
            variant: {type: string}
        reason_codes:
          type: array
          items: {type: string}
          uniqueItems: true
        fallback: {type: boolean}
        expires_at: {type: string, format: date-time}
    TransitionRequest:
      type: object
      additionalProperties: false
      required: [action, expected_version, reason]
      properties:
        action: {type: string}
        expected_version: {type: integer, minimum: 1}
        reason: {type: string, minLength: 3, maxLength: 500}
        governance_decision_id: {type: [string, 'null']}
    StateResponse:
      type: object
      additionalProperties: false
      required: [id, state, version, updated_at]
      properties:
        id: {type: string}
        state: {type: string}
        version: {type: integer, minimum: 1}
        updated_at: {type: string, format: date-time}
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, trace_id]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        trace_id: {type: string}
        reason_codes:
          type: array
          items: {type: string}
